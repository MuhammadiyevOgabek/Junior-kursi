<!DOCTYPE html>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Html bilan tanishuv</title>
</head>
<body>
    <!-- !  Html  -->
    <!--? ingliz tilidan 'HyperText Markup Language' so'zlarining qisqartmasidan olingan bo'lib, o'zbek tiliga Gibermatnlarni Belgilash Tili ma'noni beradi. Ya'ni bu til asosan matnlar yozish uchun yaratilgan.HTMLda asosiy 3 ta ibora mavjud: teg,atribut, element.  -->
    <!-- !  1. Teg -->
     <!-- ? Html odatda teglardan iborat bo'ladi. Teglar biror bir elementni belgilash uchun xizmat qiladi. Tegni ochish uchun uning nomini kichik (<) va (>) belgilar orasida yozamiz. Tegni yopish, uni ochish kabi yoziladi, lekin tegni yopishda uni ochishdan farqli o'laroq, teg nomi oldidan slesh belgisi (/) qo'yiladi. HTML da izoh () belgilari orasida yoziladi. Bu belgilar orasida yozilgan matn kompilyator tomonidan inobatga olinmaydi va brauzerda ko'rinmaydi. -->
    
     <!-- ? HTML da teglarni yozib ko'ramiz. Buning uchun Notepadyoki gedit dasturini oching va biror papkaga index.html deb saqlang. ushbu HTML faylimiz ichiga yuqorida aytilganidek:   -->
         <!-- <foo>Hello, world!</foo> -->
    <!-- ? deb yozamiz. Ushbu faylda yozilganlarni saqlab, uning ustiga bossangiz, u brauzserda ochiladi   yuqoridagi misolda biz teg haqida tushuncha olish uchun mmisol tariqasida uni foo deb nomladik.   Endi, aniq bir vazifani bajaradigan eng asosiy teglarni ko'rib chiqamiz: -->
     <foo>Hellon,</foo> <strong>World!</strong>
    
</body>
</html>
